# Windows·macOS 배포용 빌드. 결과물(실행파일 + ffmpeg)은 Actions 아티팩트.
# 태그 v* 푸시 시 GitHub Release에 zip을 올립니다. 모델(약 1.3GB)은 넣지 않음: models/README.md
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ffmpeg-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          key: ffmpeg-win-${{ hashFiles('tools/build_ffmpeg_windows_cross.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nasm
          tools/build_ffmpeg_windows_cross.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

  windows:
    needs: ffmpeg-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows
          path: src-tauri/binaries
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build (CPU 음성 인식 — 느려도 품질은 같음)
        working-directory: src-tauri
        run: cargo tauri build --no-bundle
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/dcinvox.exe dist/
          cp src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe dist/ffmpeg.exe
          cp docs/THIRD_PARTY_NOTICES.md docs/EULA.md dist/
      # 실행 점검: DLL이 다 로드되고 동봉 ffmpeg가 도는지 (모델은 저장소에 없어서 모델 항목은 실패가 정상)
      - name: Smoke test (--self-check)
        shell: bash
        run: |
          out="$(./dist/dcinvox.exe --self-check 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "ffmpeg: .* OK"
      - uses: actions/upload-artifact@v4
        with:
          name: DCinVox-windows
          path: dist

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/cache@v4
        id: cache
        with:
          path: src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          key: ffmpeg-mac-${{ hashFiles('tools/build_ffmpeg_macos.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build_ffmpeg_macos.sh
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build
        working-directory: src-tauri
        run: cargo tauri build --bundles app
      - name: Collect
        run: |
          mkdir -p dist
          cp -R src-tauri/target/release/bundle/macos/DCinVox.app dist/
          cp docs/THIRD_PARTY_NOTICES.md docs/EULA.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: DCinVox-macos
          path: dist

  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DCinVox-windows
          path: dist-windows
      - uses: actions/download-artifact@v4
        with:
          name: DCinVox-macos
          path: dist-macos
      - name: Zip artifacts
        run: |
          (cd dist-windows && zip -r ../DCinVox-windows-x64.zip .)
          (cd dist-macos && zip -ry ../DCinVox-macos-arm64.zip .)
      - name: GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              DCinVox-windows-x64.zip \
              DCinVox-macos-arm64.zip \
              --clobber
          else
            gh release create "$TAG" \
              DCinVox-windows-x64.zip \
              DCinVox-macos-arm64.zip \
              --title "DCinVox $TAG" \
              --notes-file docs/GITHUB_RELEASE.md \
              --latest
          fi
